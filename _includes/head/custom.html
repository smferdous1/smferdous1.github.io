{% include base_path %}

<!-- start custom head snippets -->
<style>
  /* Kill the right TOC sidebar everywhere */
  .sidebar__right { display: none !important; }

  /* Make the main column span full width on common layouts */
  .layout--single .page__content,
  .layout--home .page__content,
  .layout--archive .page__content,
  .page__content {
    float: none !important;
    max-width: 100% !important;
    width: 100% !important;
  }
</style>


<!-- Official UNC Charlotte icons, sourced from https://www.charlotte.edu/ -->
<link rel="icon" type="image/vnd.microsoft.icon" href="{{ base_path }}/images/favicon.ico?v=charlotte">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png?v=charlotte">
<link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/android-chrome-192x192.png?v=charlotte">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png?v=charlotte">
<link rel="manifest" href="{{ base_path }}/images/site.webmanifest?v=charlotte">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">


<!-- end custom head snippets -->
